name: Video - portrait 16K

on:
  push:
    branches:
      - arena/cc989019-game
    paths:
      - video-tools/jobs/16k-20261110.json

permissions:
  contents: write

concurrency:
  group: portrait-16k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render and verify 8640x15360 AV1
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      OUTPUT_DIR: ${{ runner.temp }}/portrait-16k
      RELEASE_TAG: video-16k-20261110-cc989019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect runner resources
        run: |
          free -h
          df -h .
          nproc
      - name: Install pinned video tools
        run: python -m pip install -r video-tools/requirements.txt
      - name: Test geometry and provenance checks
        run: python -m unittest discover -s video-tools -p 'test_*.py' -v
      - name: Render complete video and verify every frame
        run: |
          python -u video-tools/render_16k.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output "$OUTPUT_DIR/armorypass-ejoy-16k.mp4" \
            --threads 4 --cpu-used 6 --crf 18
      - name: Publish validated files as a separate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft --latest=false --target "$GITHUB_SHA" \
            --title "Вертикальное видео 16K — 8640×15360" \
            --notes-file "$OUTPUT_DIR/16k-notes-ru.md" \
            "$OUTPUT_DIR/armorypass-ejoy-16k.mp4" \
            "$OUTPUT_DIR/armorypass-ejoy-16k-preview-720p.mp4" \
            "$OUTPUT_DIR/validation-16k.json" \
            "$OUTPUT_DIR/16k-notes-ru.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
      - name: Save technical report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-16k-validation
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/portrait-16k/validation-16k.json
            ${{ runner.temp }}/portrait-16k/decoder.log
            ${{ runner.temp }}/portrait-16k/encoder.log
            ${{ runner.temp }}/portrait-16k/encoding-progress.txt
