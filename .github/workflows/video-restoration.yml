name: Video - stronger observation-based cleanup

on:
  push:
    branches:
      - arena/cc989019-game
    paths:
      - video-tools/jobs/restoration-20261110.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: video-restoration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore:
    name: Test stronger cleanup, preserve source, publish separately
    if: github.ref == 'refs/heads/arena/cc989019-game'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OUTPUT_DIR: /tmp/video-restoration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Stay on the session branch at the triggering revision
        run: |
          git checkout -B arena/cc989019-game "$GITHUB_SHA"
          test "$(git branch --show-current)" = "arena/cc989019-game"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU processing packages
        run: python -m pip install -r video-tools/requirements.txt
      - name: Test processing, provenance, publication and existing playback
        run: |
          python -m unittest discover -s video-tools -p 'test_*.py' -v
          node --test video-tools/player.test.cjs
      - name: Read the explicitly selected job profile
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'video-tools')
          from restore_strong import PROFILES, RELEASE_TAG, SOURCE_SHA256
          job = json.loads(Path('video-tools/jobs/restoration-20261110.json').read_text())
          assert job['source_sha256'] == SOURCE_SHA256 and job['release_tag'] == RELEASE_TAG
          assert job['profile'] in PROFILES
          release_id, reuse_run = job.get('existing_release_id'), job.get('reuse_delivery_run_id')
          assert release_id is None or (isinstance(release_id, int) and release_id > 0)
          assert reuse_run is None or (isinstance(reuse_run, int) and reuse_run > 0)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              print('RESTORATION_PROFILE=' + job['profile'], file=environment)
              print('RESTORATION_RELEASE_ID=' + str(release_id or ''), file=environment)
              print('REUSE_DELIVERY_RUN_ID=' + str(reuse_run or ''), file=environment)
          PY
      - name: Restore a previously validated delivery artifact when explicitly requested
        if: env.REUSE_DELIVERY_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          gh run download "$REUSE_DELIVERY_RUN_ID" --name stronger-restoration-delivery --dir "$OUTPUT_DIR"
      - name: Smoke test the complete pipeline including genuine 4K output
        if: env.REUSE_DELIVERY_RUN_ID == ''
        run: |
          python -u video-tools/restore_strong.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir /tmp/restoration-smoke --profile "$RESTORATION_PROFILE" --test-frames 6
      - name: Recheck all three strengths on six full-video sample windows
        if: env.REUSE_DELIVERY_RUN_ID == ''
        run: |
          python -u video-tools/restore_strong.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir "$OUTPUT_DIR" --profile "$RESTORATION_PROFILE" --stage prepare
      - name: Process every original frame into a lossless intermediate
        if: env.REUSE_DELIVERY_RUN_ID == ''
        run: |
          python -u video-tools/restore_strong.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir "$OUTPUT_DIR" --stage render
      - name: Export compatible 720p, Full HD and 4K with original AAC
        if: env.REUSE_DELIVERY_RUN_ID == ''
        run: |
          python -u video-tools/restore_strong.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir "$OUTPUT_DIR" --stage exports
      - name: Fully decode every output and verify frame timing and audio identity
        run: |
          python -u video-tools/restore_strong.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir "$OUTPUT_DIR" --stage validate
          python -u video-tools/restore_strong.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir "$OUTPUT_DIR" --stage notes
      - name: Preserve the complete validated delivery before attempting publication
        uses: actions/upload-artifact@v4
        with:
          name: stronger-restoration-delivery
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.OUTPUT_DIR }}/*.mp4
            ${{ env.OUTPUT_DIR }}/restoration-validation.json
            ${{ env.OUTPUT_DIR }}/restoration-sample-qa.json
            ${{ env.OUTPUT_DIR }}/restoration-analysis.json
            ${{ env.OUTPUT_DIR }}/RESTORATION-README-RU.md
      - name: Publish a separate release only after sizes and digests match
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if test -n "$RESTORATION_RELEASE_ID"; then
            extra+=(--existing-release-id "$RESTORATION_RELEASE_ID")
          fi
          python -u video-tools/publish_restoration.py \
            --folder "$OUTPUT_DIR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${extra[@]}"
      - name: Keep only small technical reports in Git, never new large MP4s
        run: |
          test "$(git branch --show-current)" = "arena/cc989019-game"
          cp "$OUTPUT_DIR/restoration-validation.json" downloads/
          cp "$OUTPUT_DIR/restoration-sample-qa.json" video-tools/
          cp "$OUTPUT_DIR/restoration-analysis.json" video-tools/
          cp "$OUTPUT_DIR/publication-restoration.json" video-tools/
          python - <<'PY'
          import subprocess
          from pathlib import Path
          tracked = {Path(p.decode()) for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if p}
          tracked.update(map(Path, ['downloads/restoration-validation.json', 'video-tools/restoration-sample-qa.json', 'video-tools/restoration-analysis.json', 'video-tools/publication-restoration.json']))
          total = sum(p.stat().st_size for p in tracked if p.is_file())
          assert total < 128 * 1024 * 1024, total
          print('Tracked-file budget:', total)
          PY
          git config user.name 'Video processing'
          git config user.email 'video-tools@users.noreply.github.com'
          git add downloads/restoration-validation.json video-tools/restoration-sample-qa.json video-tools/restoration-analysis.json video-tools/publication-restoration.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified stronger video cleanup and publication"
            git pull --rebase origin arena/cc989019-game
            git push origin arena/cc989019-game
          fi
      - name: Retain diagnostics without temporary masters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stronger-restoration-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ env.OUTPUT_DIR }}/*.json
            ${{ env.OUTPUT_DIR }}/*.log
            ${{ env.OUTPUT_DIR }}/*.progress.txt
            ${{ env.OUTPUT_DIR }}/*.md
            /tmp/restoration-smoke/*.json
            /tmp/restoration-smoke/*.log
