name: Video - bounded enhancement comparisons

on:
  push:
    branches:
      - arena/cc989019-game
    paths:
      - video-tools/jobs/variants-20261110.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-variants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  variants:
    name: Render, verify and publish all technical variants
    if: github.ref == 'refs/heads/arena/cc989019-game'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUTPUT_DIR: /tmp/video-variants
      RELEASE_TAG: video-variants-20261110-cc989019
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Stay on the session branch at the triggering revision
        run: |
          git checkout -B arena/cc989019-game "$GITHUB_SHA"
          test "$(git branch --show-current)" = "arena/cc989019-game"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned processing dependencies
        run: python -m pip install -r video-tools/requirements.txt
      - name: Run all Python regression tests
        run: python -m unittest discover -s video-tools -p 'test_*.py' -v
      - name: Run browser fallback tests
        run: node --test video-tools/player.test.cjs
      - name: Exercise the full pipeline on six silent test frames
        run: |
          python -u video-tools/enhance_variants.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir /tmp/video-variants-smoke --test-frames 6
      - name: Render all original frames, export and verify every delivery file
        run: |
          python -u video-tools/enhance_variants.py \
            --source video-tools/input/armorypass-ejoy.mp4 \
            --output-dir "$OUTPUT_DIR"
      - name: Upload verified assets to a separate draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --latest=false \
              --target "$GITHUB_SHA" --title "Все технические варианты — 720p, Full HD и 4K" \
              --notes-file "$OUTPUT_DIR/VARIANTS-README-RU.md"
          fi
          mapfile -t assets < <(python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ['OUTPUT_DIR'])
          report = json.loads((folder / 'variants-validation.json').read_text())
          assert not report['test_only']
          assert len(report['outputs']) == 13
          for item in report['outputs'].values():
              assert item['frames'] == 1518 and item['aac_unchanged'] and item['full_decode_passed']
              print(folder / item['file'])
          print(folder / report['archive']['file'])
          for name in ('variants-validation.json', 'render-analysis.json', 'VARIANTS-README-RU.md'):
              print(folder / name)
          PY
          )
          test "${#assets[@]}" = 17
          gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
      - name: Compare published asset digests and sizes before making the release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$OUTPUT_DIR/release-assets.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path(os.environ['OUTPUT_DIR'])
          release = json.loads((folder / 'release-assets.json').read_text())
          assets = {item['name']: item for item in release['assets']}
          report = json.loads((folder / 'variants-validation.json').read_text())
          expected = [item['file'] for item in report['outputs'].values()]
          expected += [report['archive']['file'], 'variants-validation.json', 'render-analysis.json', 'VARIANTS-README-RU.md']
          for name in expected:
              data = (folder / name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              assert assets[name]['state'] == 'uploaded', name
              assert assets[name]['size'] == len(data), name
              assert assets[name]['digest'] == 'sha256:' + digest, name
          proof = {'release_tag': release['tag_name'], 'release_id': release['id'], 'release_url': release['html_url'], 'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}", 'render_commit': os.environ['GITHUB_SHA'], 'verified_asset_count': len(expected), 'all_sizes_and_sha256_match': True}
          (folder / 'publication-variants.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest=false \
            --notes-file "$OUTPUT_DIR/VARIANTS-README-RU.md"
      - name: Save only the lightweight preview and small audit files on the session branch
        run: |
          test "$(git branch --show-current)" = "arena/cc989019-game"
          cp "$OUTPUT_DIR/armorypass-ejoy-balanced-watch-720p.mp4" downloads/
          cp "$OUTPUT_DIR/variants-validation.json" downloads/
          cp "$OUTPUT_DIR/render-analysis.json" video-tools/variants-analysis.json
          cp "$OUTPUT_DIR/publication-variants.json" video-tools/
          python - <<'PY'
          import subprocess
          from pathlib import Path
          tracked = {Path(p.decode()) for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if p}
          tracked.update(map(Path, ['downloads/armorypass-ejoy-balanced-watch-720p.mp4', 'downloads/variants-validation.json', 'video-tools/variants-analysis.json', 'video-tools/publication-variants.json']))
          total = sum(p.stat().st_size for p in tracked if p.is_file())
          assert total < 128 * 1024 * 1024, total
          print('Tracked-file budget:', total)
          PY
          git config user.name 'Video processing'
          git config user.email 'video-tools@users.noreply.github.com'
          git add downloads/armorypass-ejoy-balanced-watch-720p.mp4 downloads/variants-validation.json video-tools/variants-analysis.json video-tools/publication-variants.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified enhancement preview and publication reports"
            git pull --rebase origin arena/cc989019-game
            git push origin arena/cc989019-game
          fi
      - name: Save diagnostics, never large temporary masters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-variants-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ env.OUTPUT_DIR }}/*.json
            ${{ env.OUTPUT_DIR }}/*.log
            ${{ env.OUTPUT_DIR }}/*.progress.txt
            ${{ env.OUTPUT_DIR }}/*.md
            /tmp/video-variants-smoke/*.json
            /tmp/video-variants-smoke/*.log
